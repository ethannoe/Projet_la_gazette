# Environnement de dev : `bin/dev` (ou `docker compose up --build`).
# Les identifiants par défaut ne servent qu'en local ; à surcharger dans un .env.
name: la-gazette

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gazette}
      POSTGRES_USER: ${POSTGRES_USER:-gazette}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gazette}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  collect:
    build:
      context: .
      target: runtime
    image: la-gazette:dev
    # bin/dev passe l'utilisateur courant pour que ./data reste à nous (Linux)
    user: "${LOCAL_USER:-10001:10001}"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gazette}:${POSTGRES_PASSWORD:-gazette}@db:5432/${POSTGRES_DB:-gazette}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

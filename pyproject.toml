[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "la-gazette"
version = "0.2.0"
description = "Chaque matin, de quoi parle la presse française : thèmes du jour, journaux, liens."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0,<7",
    "requests>=2.32,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gazette = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

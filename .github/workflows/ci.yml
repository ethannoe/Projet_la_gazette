# lint → tests → build de l'image → push sur ghcr.io (seulement depuis main).
# Sur une pull request : mêmes étapes, l'image est construite mais pas publiée.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6,<1"
      - run: ruff check src tests

  test:
    needs: lint
    runs-on: ubuntu-latest
    # Une vraie base pour les tests de la collecte (même image que docker-compose.yml)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gazette
          POSTGRES_USER: gazette
          POSTGRES_PASSWORD: gazette
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gazette -d gazette"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://gazette:gazette@localhost:5432/gazette
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: pytest

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - name: Nom et tag de l'image (AAAAMMJJHHMMSS-sha)
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Résumé
        run: |
          if [ "$PUSH" = "true" ]; then
            echo "Image publiée : \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Image construite, non publiée (pas sur main)." >> "$GITHUB_STEP_SUMMARY"
          fi

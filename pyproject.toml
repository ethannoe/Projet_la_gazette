[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "la-gazette"
version = "0.3.0"
description = "Chaque matin, de quoi parle la presse française : thèmes du jour, journaux, liens."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0,<7",
    "requests>=2.32,<3",
    "psycopg[binary]>=3.2,<4",
    # même version que l'image du serveur Prefect dans docker-compose.yml
    "prefect==3.8.8",
    # thèmes (TD 5) : versions figées, les runs doivent être reproductibles
    "fastembed==0.9.0",
    "scikit-learn==1.9.1",
    "pyyaml>=6.0,<7",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gazette = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

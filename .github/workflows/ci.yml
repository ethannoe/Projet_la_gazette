# lint → tests → build de l'image → push sur ghcr.io (seulement depuis main).
# Sur une pull request : mêmes étapes, l'image est construite mais pas publiée.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6,<1"
      - run: ruff check src tests

  test:
    needs: lint
    runs-on: ubuntu-latest
    # Une vraie base pour les tests de la collecte (même image que docker-compose.yml)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gazette
          POSTGRES_USER: gazette
          POSTGRES_PASSWORD: gazette
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gazette -d gazette"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://gazette:gazette@localhost:5432/gazette
      GAZETTE_TEST_MODELE: "1"  # le vrai modèle d'embeddings (220 Mo, téléchargé à chaque fois)
      GAZETTE_MODELES_DIR: /tmp/modeles
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: pytest

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - name: Nom et tag de l'image (AAAAMMJJHHMMSS-sha)
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Résumé
        run: |
          if [ "$PUSH" = "true" ]; then
            echo "Image publiée : \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Image construite, non publiée (pas sur main)." >> "$GITHUB_STEP_SUMMARY"
          fi

  evaluer-candidat:
    needs: [test]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.eval.outputs.run_id }}
    env:
      DATABASE_URL: ${{ secrets.GAZETTE_DATABASE_URL }}
      GAZETTE_MODELES_DIR: modeles
      GAZETTE_RUNS_DIR: runs
      GAZETTE_CODE_VERSION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .
      - run: mkdir -p modeles runs
      - name: Évaluer les paramètres de la PR sur la journée précédente
        id: eval
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Le secret GAZETTE_DATABASE_URL est requis pour évaluer les données réelles." >&2
            exit 1
          fi
          python -m gazette evaluer-candidat > run-id.txt
          run_id="$(cat run-id.txt)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Évaluation candidate : $run_id" >> "$GITHUB_STEP_SUMMARY"
          echo "Échantillon : runs/$run_id/evaluation.json dans l'artifact evaluation-candidat." >> "$GITHUB_STEP_SUMMARY"
          verdict="$(python -c 'import json, pathlib, sys; print(json.loads(pathlib.Path(sys.argv[1]).read_text())["verdict"])' "runs/$run_id/evaluation.json")"
          if [ "$verdict" = "recale" ]; then
            echo "L'évaluation a recalé ce run ; la promotion est bloquée." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-candidat
          path: runs/

  promouvoir-candidat:
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      DATABASE_URL: ${{ secrets.GAZETTE_DATABASE_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Promouvoir après fusion
        run: |
          code_version="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.sha')"
          if [ -z "$code_version" ] || [ "$code_version" = "null" ]; then
            echo "Aucune PR associée à ce commit ; promotion refusée." >&2
            exit 1
          fi
          python -m gazette promouvoir-candidat --code-version "$code_version" --par "CI GitHub"
          python -m gazette versions
